---
layout: single
title: Publications
permalink: /publications/
author_profile: true
---

{% assign sorted_publications = site.publications | sort: "date" | reverse %}
{% for post in sorted_publications %}
<article class="archive__item" itemscope itemtype="https://schema.org/ScholarlyArticle">
  <h2 class="archive__item-title" itemprop="headline">{{ post.title }}</h2>
  <p class="archive__item-excerpt" itemprop="description">{{ post.citation }}</p>
  <p><em>{{ post.venue }}</em></p>
</article>
{% endfor %}
